<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>말하기 전에 · 실시간판</title>
<meta name="description" content="링크 하나로 바로 들어오는 수업용 익명 한줄 교실">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=Press+Start+2P&display=swap">
<style>
:root{
  --paper:#f4f6ee; --card:#fff; --card2:#fafbf5; --mint:#e6eddf; --ink:#22342c; --muted:#5d6b62; --faint:#8a968d;
  --line:#d8ded0; --green:#204e3d; --green2:#2c6a52; --amber:#c4762a; --sig:#a8452b;
  --sans:'Noto Sans KR',system-ui,-apple-system,'Segoe UI',sans-serif; --px:'Press Start 2P',monospace; color-scheme:light}
@media (prefers-color-scheme:dark){:root{
  --paper:#0f1411; --card:#19201b; --card2:#1e2620; --mint:#1d2b23; --ink:#e8efe6; --muted:#a3b3a8; --faint:#7e8d83;
  --line:#2b352d; --green:#7cc3a1; --green2:#9ad5b8; --amber:#e3a765; --sig:#e08d72; color-scheme:dark}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:17px;line-height:1.65;overflow:hidden;-webkit-font-smoothing:antialiased}
#app{height:100%;display:flex;flex-direction:column;min-height:0}
h1,h2,h3,h4{margin:0;line-height:1.3}
p{margin:0}
button{font:inherit;font-weight:500;cursor:pointer;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:10px 15px}
button:hover{border-color:var(--green)}
button.pri{background:var(--green);border-color:var(--green);color:#fff;font-weight:700}
@media (prefers-color-scheme:dark){button.pri{color:#0f1411}}
button.sm{padding:7px 12px;font-size:14.5px;border-radius:9px}
button.lg{padding:14px 20px;font-size:18px;font-weight:700;border-radius:12px}
button.on{background:var(--mint);border-color:var(--green);color:var(--green2);font-weight:700}
button[disabled]{opacity:.45;cursor:not-allowed}
input,textarea,select{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px;width:100%}
input:focus,textarea:focus,select:focus,button:focus-visible{outline:3px solid var(--amber);outline-offset:1px}
label.fl{display:block;font-size:14px;font-weight:700;color:var(--muted);margin-bottom:6px}
.pad{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#bar{flex:none;display:flex;align-items:center;gap:10px 14px;flex-wrap:wrap;background:var(--card);border-bottom:1px solid var(--line);padding-block:10px}
.brand{display:flex;align-items:center;gap:9px;font-weight:700;font-size:18px}
.brand i{display:grid;place-items:center;width:30px;height:30px;border-radius:9px;background:var(--green);color:#fff;font-family:var(--px);font-size:9px;font-style:normal}
.brand em{font-style:normal;font-size:12.5px;color:var(--faint);font-weight:400}
.sp{flex:1}
.chip{font-size:13.5px;color:var(--muted);background:var(--card2);border:1px solid var(--line);border-radius:999px;padding:5px 12px;white-space:nowrap}
.chip b{color:var(--ink)}
.chip.live{background:var(--mint);border-color:var(--green);color:var(--green2);font-weight:700}
.chip.warn{background:#fdecdf;color:#9a4a18;border-color:var(--amber);font-weight:700}
@media (prefers-color-scheme:dark){.chip.warn{background:#33210f;color:#f0b27a}}
.chip.off{color:var(--faint)}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{border:0;border-radius:0;padding:7px 14px;font-size:14.5px;background:transparent}
.seg button+button{border-left:1px solid var(--line)}
.seg button.on{background:var(--green);color:#fff}
@media (prefers-color-scheme:dark){.seg button.on{color:#0f1411}}
#hud{flex:none;display:flex;align-items:center;gap:9px;flex-wrap:wrap;padding-block:9px;border-bottom:1px solid var(--line);background:var(--card2)}
#task{font-size:15px;font-weight:700;padding:7px 14px;border-radius:999px;background:var(--mint);color:var(--green2)}
#task.urgent{background:#fdecdf;color:#9a4a18;border:1px solid var(--amber)}
@media (prefers-color-scheme:dark){#task.urgent{background:#33210f;color:#f0b27a}}
#task.idle{background:transparent;color:var(--faint);font-weight:500}
#goto{display:flex;gap:7px;flex-wrap:wrap}
#goto button{position:relative}
.badge{position:absolute;top:-7px;right:-7px;min-width:20px;height:20px;border-radius:999px;background:var(--sig);color:#fff;font-size:12px;font-weight:700;display:grid;place-items:center;padding:0 5px}
#main{flex:1;min-height:0;display:flex;gap:16px;padding-block:14px 0;overflow:hidden}
#mapwrap{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:8px;min-height:0;overflow:auto}
canvas#cv{display:block;max-width:100%;height:auto;image-rendering:pixelated;border-radius:12px;border:1px solid var(--line);background:#2f3a33}
#boardwrap{flex:1;min-width:0;overflow-y:auto;padding-right:4px}
#dock{flex:none;background:var(--card);border-top:1px solid var(--line);padding-block:10px;padding-bottom:max(10px,env(safe-area-inset-bottom,0px));display:flex;align-items:center;gap:10px;flex-wrap:wrap}
#dock .q{font-size:15px;font-weight:500;flex:1;min-width:150px}
#dock .q em{font-style:normal;color:var(--faint);font-weight:400;font-size:13.5px;display:block}
.react{display:flex;gap:8px}
.react button{font-size:17px;padding:9px 14px;display:flex;align-items:center;gap:7px;line-height:1}
.react button span{font-size:14px;font-weight:700}
.react button.hand.on{background:var(--amber);border-color:var(--amber);color:#fff}
#mask{position:fixed;inset:0;background:rgba(12,18,14,.6);display:grid;place-items:center;padding:16px;z-index:40}
#mask[hidden]{display:none}
.sheet{background:var(--card);border:1px solid var(--line);border-radius:16px;width:min(620px,100%);max-height:min(88vh,780px);overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.35)}
.sheet.wide{width:min(880px,100%)}
.sheet .top{position:sticky;top:0;background:var(--card);border-bottom:1px solid var(--line);padding:15px 18px;display:flex;align-items:center;gap:12px;z-index:2}
.sheet .top h3{font-size:19px;flex:1}
.sheet .top .sub{font-size:13.5px;color:var(--faint);font-weight:400}
.in{padding:18px;display:flex;flex-direction:column;gap:15px}
.in p{font-size:15.5px;color:var(--muted)}
.note{font-size:14.5px;color:var(--muted);background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:12px 15px}
.note b{color:var(--ink)}
.note.warn{border-color:var(--amber);background:#fdf3e8}
@media (prefers-color-scheme:dark){.note.warn{background:#2a1f12}}
.board{background:var(--green);color:#f3f7f0;border-radius:16px;padding:24px}
.board .sub{font-size:13.5px;letter-spacing:.06em;color:#bcd8c9;font-weight:700;display:flex;align-items:center;gap:8px}
.board h2{font-size:clamp(22px,3.6vw,30px);margin-top:10px;color:#fff;font-weight:700}
.board .meta{display:flex;gap:10px 18px;flex-wrap:wrap;margin-top:16px;align-items:center}
.board .clock{font-family:var(--px);font-size:clamp(20px,4vw,30px);color:#ffe29a}
.board .clock.done{color:#f3a08a}
.board .acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.board .acts button{background:rgba(255,255,255,.14);border-color:rgba(255,255,255,.3);color:#fff}
.board .acts button.pri{background:#f3f7f0;border-color:#f3f7f0;color:var(--green)}
.dotg{width:8px;height:8px;border-radius:50%;background:#8fe0b4;display:inline-block}
.grid{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(230px,1fr);gap:16px;align-items:start}
.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:13px}
.panel h3{font-size:17px;display:flex;align-items:center;gap:9px}
.panel h3 .n{font-size:13.5px;color:var(--faint);font-weight:500}
.ans{display:flex;flex-direction:column;gap:9px}
.ansrow{display:flex;gap:12px;align-items:flex-start;border:1px solid var(--line);border-radius:11px;padding:12px 14px;background:var(--card2);font-size:16px}
.ansrow .cf{flex:none;font-size:12px;font-weight:700;border-radius:999px;padding:3px 9px;background:var(--mint);color:var(--green2);white-space:nowrap}
.ansrow .cf.c1{background:#fdecdf;color:#9a4a18}
@media (prefers-color-scheme:dark){.ansrow .cf.c1{background:#33210f;color:#f0b27a}}
.empty{text-align:center;color:var(--faint);padding:32px 12px;font-size:15px;border:1px dashed var(--line);border-radius:12px}
.gl{display:flex;flex-direction:column;gap:10px}
.gc{border:1px solid var(--line);border-radius:12px;padding:14px;background:var(--card2);display:flex;flex-direction:column;gap:9px}
.gc.inv{border-color:var(--amber);background:#fdf3e8}
@media (prefers-color-scheme:dark){.gc.inv{background:#2a1f12}}
.gc .gh{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.gc .gh b{font-size:17px}
.gc .gh .n{font-size:14px;font-weight:700;color:var(--green2);background:var(--mint);border-radius:999px;padding:3px 10px}
.gc .rep{font-size:15px;color:var(--muted);border-left:3px solid var(--line);padding-left:11px}
.dist{display:flex;flex-direction:column;gap:9px}
.dist .r{display:grid;grid-template-columns:1fr auto;gap:3px 12px;font-size:14.5px;color:var(--muted)}
.dist .r b{color:var(--green2);font-variant-numeric:tabular-nums}
.pbar{grid-column:1/-1;height:9px;border-radius:999px;background:var(--mint);overflow:hidden}
.pbar i{display:block;height:100%;background:var(--green)}
.big{background:var(--mint);border-radius:14px;padding:20px;text-align:center;font-size:19px;font-weight:700;color:var(--green2)}
.big b{font-size:30px;display:block;font-variant-numeric:tabular-nums}
.hands{display:flex;flex-direction:column;gap:9px}
.hand{display:flex;align-items:center;gap:11px;border:1px solid var(--amber);border-radius:11px;padding:11px 14px;background:#fdf3e8;font-size:16px;font-weight:700;color:#8a4414}
@media (prefers-color-scheme:dark){.hand{background:#2a1f12;color:#f0b27a}}
.hand .em{font-size:22px}
.posts{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px}
.post{background:#fdf6c9;color:#2b2a1d;border-radius:6px;padding:14px;font-size:15.5px;display:flex;flex-direction:column;gap:10px;box-shadow:0 2px 6px rgba(0,0,0,.16);min-height:104px}
.post.p2{background:#d8f0f7}.post.p3{background:#fbdce4}.post.p4{background:#e2f2cf}
.post .f{display:flex;align-items:center;gap:8px;margin-top:auto;font-size:13px;color:#4b4a3a;font-weight:700}
.post .f button{background:rgba(255,255,255,.7);border-color:rgba(0,0,0,.14);color:#2b2a1d;padding:4px 10px;font-size:13px;border-radius:8px}
.qrow{display:flex;gap:12px;align-items:flex-start;border:1px solid var(--line);border-radius:11px;padding:13px;background:var(--card2);font-size:16px}
.qrow.done{opacity:.55}
.qrow .me{flex:none;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:12.5px;color:var(--faint);font-weight:700}
.tbl{width:100%;border-collapse:collapse;font-size:15px}
.tbl th,.tbl td{text-align:left;padding:10px 11px;border-bottom:1px solid var(--line);color:var(--muted)}
.tbl th{font-size:12.5px;color:var(--faint);text-transform:uppercase}
.tbl td b{color:var(--ink)}
.kv{display:flex;gap:18px;flex-wrap:wrap}
.kv div{display:flex;flex-direction:column}
.kv b{font-size:24px;font-variant-numeric:tabular-nums;color:var(--green2)}
.kv span{font-size:12.5px;color:var(--faint)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.rowf{display:flex;gap:9px;flex-wrap:wrap}
.conf{display:flex;gap:9px}
.conf button{flex:1;padding:12px 8px}
.look{display:flex;align-items:center;gap:14px;border:1px solid var(--line);border-radius:12px;padding:14px;background:var(--card2)}
.look canvas{width:60px;height:80px;border:0;background:transparent;flex:none}
.addr{background:var(--mint);border-radius:14px;padding:18px;text-align:center}
.addr .lb{font-size:13px;font-weight:700;color:var(--green2);letter-spacing:.06em}
.addr .ad{font-size:clamp(20px,4.2vw,30px);font-weight:700;color:var(--green2);word-break:break-all;margin-top:6px;line-height:1.25}
.addr .cd{font-family:var(--px);font-size:clamp(18px,4vw,26px);color:var(--green2);margin-top:10px;letter-spacing:.06em}
.stage{position:fixed;inset:0;background:var(--green);z-index:60;display:flex;flex-direction:column;justify-content:center;gap:24px;padding:6vh 6vw;color:#fff}
.stage[hidden]{display:none}
.stage .sq{font-size:clamp(28px,6.5vw,62px);font-weight:700;line-height:1.3}
.stage .sm2{font-size:15px;color:#bcd8c9;letter-spacing:.08em;font-weight:700}
.stage .srow{display:flex;gap:24px;align-items:center;flex-wrap:wrap}
.stage .big2{font-family:var(--px);font-size:clamp(26px,6vw,54px);color:#ffe29a}
.stage .join{background:rgba(255,255,255,.12);border-radius:16px;padding:18px 24px}
.stage .join .u{font-size:clamp(20px,4.6vw,40px);font-weight:700;word-break:break-all}
.stage .join .c{font-family:var(--px);font-size:clamp(18px,4vw,30px);color:#ffe29a;margin-top:8px}
.ovl{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);background:rgba(14,20,16,.9);color:#fff;font-size:14px;padding:7px 15px;border-radius:999px;white-space:nowrap;pointer-events:none}
ol.steps{margin:0;padding-left:1.3em;display:flex;flex-direction:column;gap:10px;font-size:15px;color:var(--muted)}
ol.steps b{color:var(--ink)}
code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13.5px;background:var(--card2);border:1px solid var(--line);border-radius:6px;padding:1px 5px}
@media (max-width:900px){.grid{grid-template-columns:1fr}#main{padding-inline:0}.row2{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="app">
  <header id="bar" class="pad">
    <div class="brand"><i>BIS</i>말하기 전에<em>실시간판 · 키스톤 8조</em></div>
    <div class="sp"></div>
    <span class="chip" id="netchip">연결 준비 중</span>
    <span class="chip" id="whochip">미입장</span>
    <div class="seg" id="modeseg"></div>
    <div class="seg" id="roleseg"></div>
    <button class="sm" data-act="help">도움말</button>
  </header>
  <div id="hud" class="pad">
    <div id="task" class="idle">—</div><div class="sp"></div><div id="goto"></div>
  </div>
  <div id="main" class="pad">
    <div id="mapwrap"><div style="position:relative;line-height:0"><canvas id="cv" width="400" height="192"></canvas><div class="ovl" id="ovl" hidden></div></div></div>
    <div id="boardwrap" hidden></div>
  </div>
  <div id="dock" class="pad"></div>
</div>
<div id="mask" hidden></div>
<div class="stage" id="stage" hidden></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/peerjs/1.5.4/peerjs.min.js"></script>
<script>
(function(){
'use strict';
var $=function(s){return document.querySelector(s)}, now=function(){return Date.now()};
function uid(p){return p+Math.random().toString(36).slice(2,8)}
function pick(a){return a[Math.floor(Math.random()*a.length)]}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]})}
function clamp(v,a,b){return v<a?a:v>b?b:v}
function pct(n,d){return d?Math.round(n/d*100):0}
function lsGet(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}}
function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
function clone(o){return JSON.parse(JSON.stringify(o))}

var ADJ=['조용한','차분한','꼼꼼한','느긋한','성실한','부지런한','상냥한','단단한','맑은','따뜻한','영리한','의젓한','씩씩한','담담한','수줍은','든든한'];
var ANI=['비둘기','고양이','수달','다람쥐','부엉이','고래','여우','토끼','사슴','거북','참새','너구리','치타','알파카','펭귄','두루미'];
var BODY=['#4f6fb5','#5f9a73','#b5705a','#8c6bb1','#4a9aa8','#b59a4f','#a85f7f','#5d6b85'];
var HAIR=['#2b2118','#4a3524','#6b4a2a','#1d2430','#5a3a46','#2f3b2a'];
var ROOMS=[{id:'r1',no:'N201',course:'키스톤디자인',sec:'13분반',main:true},
 {id:'r2',no:'N202',course:'인간과 디자인',sec:'2분반'},{id:'r3',no:'N203',course:'통계학입문',sec:'5분반'},
 {id:'r4',no:'N204',course:'서비스 기획',sec:'1분반'},{id:'r5',no:'N205',course:'커뮤니케이션론',sec:'3분반'},
 {id:'r6',no:'N206',course:'진로와 자기이해',sec:'7분반'}];
var SEEDQ=['이 사례에서 가장 큰 문제는 뭐라고 생각해요?','여러분이 이 상황이라면 어떻게 하겠어요?','지난 시간 내용 중 오늘 주제와 연결되는 게 뭐가 있을까요?'];
var POOL={0:['책임 주체가 불분명한 게 문제예요','누가 책임지는지 정해져 있지 않아요','정보를 미리 공개하지 않은 게 문제','정보 공개가 너무 늦었어요','비용 부담을 누가 지는지가 문제','이용자와 소통이 없었어요','잘 모르겠어요'],
 1:['먼저 알리고 양해를 구할 것 같아요','이용자 의견을 먼저 모을 것 같아요','단계적으로 적용하겠어요','일단 중단하고 다시 검토하겠어요','잘 모르겠어요'],
 2:['사용자 조사에서 나온 불편이 오늘 주제랑 연결돼요','문제 정의 단계가 오늘 내용과 이어져요','이해관계자 지도가 오늘 사례에 쓰일 것 같아요','잘 모르겠어요'],
 g:['기준이 명확하지 않은 게 문제 같아요','시간이 부족한 게 가장 큰 이유 같아요','소통이 부족한 게 원인 같아요','잘 모르겠어요']};
var STOP={'그리고':1,'하지만':1,'저는':1,'제가':1,'우리':1,'그냥':1,'정말':1,'너무':1,'조금':1,'같아요':1,'같습니다':1,'생각':1,'합니다':1,'해요':1,'모르겠어':1,'모르겠':1,'있어':1,'없어':1,'한다':1,'된다':1,'대해':1,'위해':1};

/* ───────── 방 주소 ─────────
   학생은 QR 없이 들어옵니다.
   ① 수업 링크   …/?r=keystone13  ← 사이버캠퍼스 공지·단톡방에 한 번만 올려두면 끝
   ② 주소 + 코드  주소만 치고 들어오면 코드(KEYSTONE13) 입력 화면
   ③ 다시 오기   한 번 들어온 사람은 주소만 열면 같은 수업으로 자동 입장          */

/* ───────── 네트워크 ─────────
   세 겹으로 둡니다. 한 겹이 막혀도 수업은 그대로 굴러갑니다.
   ① 이 창     — 인터넷이 없어도 바로 입장. 아무도 수업을 열지 않았으면 이 창이 엽니다.
   ② 같은 기기 — BroadcastChannel. 같은 브라우저의 다른 창/탭끼리 실시간 동기화(설정·인터넷 불필요).
   ③ 다른 기기 — PeerJS 공용 중계(0.peerjs.com). 무료 서버라 자주 막히므로 '되면 좋은 것'으로만 씁니다.
   직접 띄운 PeerServer가 있으면 주소에 &peer=호스트:포트 를 붙이면 그쪽을 씁니다.            */
function peerId(r){ return 'bis8-'+String(r).toLowerCase().replace(/[^a-z0-9]/g,'') }
function setNet(s){ NET=s; renderBar() }

var TABID=uid('tab'), BC=null, VIA='', REMOTE='off', settled=false, hostSeen=0;

function brokerOpt(){
  var m=/[?&]peer=([^&]+)/.exec(location.search); if(!m)return null;
  var s=decodeURIComponent(m[1]).replace(/^wss?:\/\//i,'').replace(/\/+$/,'');
  var sl=s.indexOf('/'), hp=(sl<0?s:s.slice(0,sl)).split(':'), path=sl<0?'/':s.slice(sl);
  var loc=/^(localhost|127\.0\.0\.1)$/i.test(hp[0]);
  return {host:hp[0],port:hp[1]?+hp[1]:(loc?9000:443),path:path,secure:!loc,debug:0};
}
function peerOpt(){ return brokerOpt()||{debug:0} }

/* ── 메시지 보내기 (붙어 있는 길로 나간다) ── */
function toHost(m){
  if(VIA==='peer'&&hostConn&&hostConn.open){ try{hostConn.send(m)}catch(e){} return true }
  if(VIA==='bc'){ bcSay({k:'c2h',m:m}); return true }
  return false;
}
function send(msg){ if(HOST){ apply(msg.op,msg.a,'host'); return } if(!toHost(msg))ui.pendingJoin=msg }
function flushPending(){ var p=ui.pendingJoin; if(!p)return; ui.pendingJoin=null; send(p);
  if(ui.modal==='enter')closeModal(); fit(); paint() }

/* ── ① 이 창이 수업을 연다 (네트워크 없이도 바로 됨) ── */
function settle(){ if(settled||HOST||VIA)return; hostHere() }
function hostHere(){
  if(HOST)return;
  settled=true;
  if(ME&&ME!=='host'&&S.players[ME]){                 /* 호스트 창이 닫혀 내가 이어받는 경우 */
    var keep={'host':S.players[ME]},k;
    for(k in S.players) if(S.players[k].bot)keep[k]=S.players[k];
    S.players=keep;
  }
  HOST=true; ME='host'; VIA=''; hostConn=null; conns=[];
  setNet('local'); bcOpen(); bcSay({k:'host'});
  peerHostClaim(); flushPending(); paint();
}

/* ── ② 같은 기기의 다른 창 ── */
function bcOpen(){
  if(BC||!ROOM||typeof BroadcastChannel==='undefined')return;
  try{ BC=new BroadcastChannel('bis8ch-'+peerId(ROOM)) }catch(e){ BC=null; return }
  BC.onmessage=function(ev){ try{bcMsg(ev.data)}catch(e){} };
}
function bcSay(m){ if(!BC)return; m.from=TABID; try{BC.postMessage(m)}catch(e){} }
function bcConn(id){ return {peer:id,open:true,bc:true,seen:now(),
  send:function(m){ bcSay({k:'h2c',to:id,m:m}) }, close:function(){}} }
function findConn(id){ for(var i=0;i<conns.length;i++)if(conns[i].peer===id)return conns[i]; return null }
function bcGreet(id){ var c=findConn(id); if(!c){c=bcConn(id);conns.push(c)}
  c.seen=now(); c.send({t:'hello',id:id}); c.send({t:'s',s:S}); return c }
function bcMsg(d){
  if(!d||d.from===TABID)return;
  if(HOST){
    if(d.k==='whois'){ bcSay({k:'host'}); return }
    if(d.k==='hi'){ bcGreet(d.from); return }
    if(d.k==='ping'){ var c=findConn(d.from); if(c){c.seen=now();bcSay({k:'pong',to:d.from})} else bcSay({k:'rehi',to:d.from}); return }
    if(d.k==='c2h'){ var c2=findConn(d.from)||bcGreet(d.from); c2.seen=now(); onClientMsg(c2,d.m); return }
    if(d.k==='bye'){ var c3=findConn(d.from); if(c3)drop(c3); return }
    if(d.k==='host'&&d.from<TABID)location.reload();   /* 같은 순간에 둘이 열렸으면 하나만 남는다 */
    return;
  }
  if(d.k==='host'||(d.k==='rehi'&&d.to===TABID)){ hostSeen=now(); bcAttach(); return }
  if(d.k==='pong'&&d.to===TABID){ hostSeen=now(); return }
  if(d.k==='h2c'&&d.to===TABID){ hostSeen=now(); onHostMsg(d.m); return }
  if(d.k==='hostbye'){ reelect(); return }
}
function reelect(){                      /* 열려 있던 창이 사라졌다 — 남은 창 하나가 이어받는다 */
  if(HOST)return;
  VIA=''; settled=false; hostSeen=now(); setNet('connecting');
  bcSay({k:'whois'}); setTimeout(settle,400+Math.random()*700);
}
function bcAttach(){
  if(HOST)return;
  if(VIA!=='bc'){ VIA='bc'; ME=TABID; settled=true; setNet('bc') }
  hostSeen=now();
  bcSay({k:'hi'}); flushPending(); paint();
}
setInterval(function(){
  if(VIA==='bc'){ bcSay({k:'ping'}); if(hostSeen&&now()-hostSeen>9000)reelect() }
  if(HOST){ var t=now(); conns.filter(function(c){return c.bc&&t-c.seen>8000}).forEach(drop) }
},2500);

/* ── ③ 다른 기기 (공용 중계 · 되면 쓰고 안 되면 넘어간다) ── */
function peerKill(){ try{ if(peer)peer.destroy() }catch(e){} peer=null }
function peerClient(){
  if(typeof Peer==='undefined'){ REMOTE='blocked'; return }
  peerKill();
  try{ peer=new Peer(undefined,peerOpt()) }catch(e){ REMOTE='blocked'; settle(); return }
  peer.on('open',function(id){ if(HOST||VIA==='bc'){peerKill();return} connectHost(id) });
  peer.on('error',function(e){
    if(e&&e.type==='peer-unavailable'){ settle(); return }
    REMOTE='blocked'; settle(); });
}
function connectHost(myid){
  if(!peer||peer.destroyed||HOST||VIA==='bc')return;
  var c=peer.connect(peerId(ROOM),{reliable:true}); if(!c){ settle(); return }
  var ok=false;
  c.on('open',function(){ ok=true; hostConn=c; ME=myid; VIA='peer'; settled=true; REMOTE='on';
    setNet('joined'); flushPending(); if(!ui.modal&&!joined())openModal('enter'); paint() });
  c.on('data',function(m){ onHostMsg(m) });
  c.on('close',function(){ if(VIA==='peer'){ hostConn=null; VIA=''; setNet('lost'); paint();
    setTimeout(function(){connectHost(myid)},2500) } });
  c.on('error',function(){ if(!ok)settle() });
  setTimeout(function(){ if(!ok)settle() },3500);
}
function peerHostClaim(){
  if(typeof Peer==='undefined'||!HOST){ if(typeof Peer==='undefined')REMOTE='blocked'; return }
  peerKill();
  try{ peer=new Peer(peerId(ROOM),peerOpt()) }catch(e){ REMOTE='blocked'; return }
  peer.on('open',function(){ REMOTE='on'; setNet('hosting'); paint() });
  peer.on('error',function(e){
    if(e&&e.type==='peer-unavailable')return;
    REMOTE=(e&&e.type==='unavailable-id')?'taken':'blocked';
    if(NET==='hosting')setNet('local'); else paint(); });
  peer.on('connection',function(c){
    conns.push(c);
    c.on('data',function(m){ onClientMsg(c,m) });
    c.on('close',function(){ drop(c) });
    c.on('error',function(){ drop(c) });
    c.on('open',function(){ c.send({t:'hello',id:c.peer}); c.send({t:'s',s:S}) });
  });
}
setInterval(function(){                      /* 중계가 풀리면 새로고침 없이 다시 붙는다 */
  if(HOST&&REMOTE!=='on'&&REMOTE!=='taken'&&typeof Peer!=='undefined')peerHostClaim();
},30000);

function drop(c){
  conns=conns.filter(function(x){return x!==c});
  if(S.players[c.peer]){ delete S.players[c.peer]; bump() }
}
function bcast(msg){ conns.forEach(function(c){ if(c.open)try{c.send(msg)}catch(e){} }) }
function bump(){ S.v++; bcast({t:'s',s:S}); paint() }
function onClientMsg(c,m){
  if(!m)return;
  if(m.t==='op')apply(m.op,m.a,c.peer);
  else if(m.t==='pos'){ var p=S.players[c.peer]; if(p){p.x=m.x;p.y=m.y;p.dir=m.dir;p.room=m.room} }
}
function onHostMsg(m){
  if(!m)return;
  if(m.t==='s'){ S=m.s; paint() }
  else if(m.t==='pl'){ for(var k in m.p){ if(S.players[k]&&k!==ME){S.players[k].x=m.p[k][0];S.players[k].y=m.p[k][1];S.players[k].dir=m.p[k][2];S.players[k].room=m.p[k][3]} } }
}
setInterval(function(){
  if(!HOST||!conns.length)return;
  var p={},k; for(k in S.players){var q=S.players[k]; p[k]=[Math.round(q.x||0),Math.round(q.y||0),q.dir||0,q.room||null]}
  bcast({t:'pl',p:p});
},140);

/* ───────── 동작 (교수 화면에서만 실행) ───────── */
function apply(op,a,from){
  if(!HOST)return;
  var q=S.q,i;
  switch(op){
    case 'join':
      var used={},n=0; for(i in S.players) if(S.players[i].seat!=null)used[S.players[i].seat]=1;
      while(used[n])n++;
      S.players[from]={nick:a.nick,look:a.look,role:a.role,room:null,seat:n,x:43,y:58,dir:0,at:now()};
      break;
    case 'leave': delete S.players[from]; break;
    case 'role': if(S.players[from])S.players[from].role=a; break;
    case 'room': if(S.players[from]){S.players[from].room=a;S.players[from].x=a?192:43;S.players[from].y=a?236:58} break;
    case 'emote': if(S.players[from]){S.players[from].emote=a;S.players[from].emoteAt=now()} break;
    case 'hand': if(!q)return; i=q.hands.indexOf(from); if(i<0)q.hands.push(from); else q.hands.splice(i,1); break;
    case 'ask':
      if(S.q)S.hist.push(S.q);
      S.subject=a.sub||S.subject;
      S.q={id:uid('q'),subject:a.sub,prompt:a.prompt||'교수님이 말로 한 질문',secs:a.secs,leftMs:a.secs*1000,
        running:false,startedAt:now(),endsAt:now()+a.secs*1000,open:true,answers:[],invited:null,hands:[],
        spoken:[],thanked:[],extra:0,firstAt:null,survey:[]};
      break;
    case 'tstart': if(q){q.endsAt=now()+(q.leftMs||q.secs*1000);q.running=true} break;
    case 'tpause': if(q){q.leftMs=Math.max(0,q.endsAt-now());q.running=false} break;
    case 'treset': if(q){q.leftMs=q.secs*1000;q.running=false} break;
    case 'closeq': if(q)q.open=false; break;
    case 'reopen': if(q)q.open=true; break;
    case 'newq': if(S.q){S.hist.push(S.q);S.q=null} break;
    case 'submit':
      if(!q||!q.open)return;
      if(q.answers.some(function(x){return x.pid===from}))return;
      q.answers.push({id:uid('a'),pid:from,text:String(a.text).slice(0,100),c:a.c,at:now()});
      break;
    case 'invite': if(q)q.invited=a; break;
    case 'uninvite': if(q)q.invited=null; break;
    case 'heard': if(q){ if(q.spoken.indexOf(a)<0)q.spoken.push(a); if(!q.firstAt)q.firstAt=now() } break;
    case 'thank': if(q){ i=q.thanked.indexOf(a); i<0?q.thanked.push(a):q.thanked.splice(i,1) } break;
    case 'spoke': if(q){ q.extra=(q.extra||0)+1; if(!q.firstAt)q.firstAt=now() } break;
    case 'survey': if(q){ if(q.survey.some(function(s){return s.pid===from}))return; q.survey.push({pid:from,raise:!!a.raise,submitted:!!a.submitted}) } break;
    case 'topic': S.board.topic=String(a).slice(0,120); break;
    case 'post': S.board.posts.push({id:uid('p'),text:String(a).slice(0,80),likes:[],pin:false,at:now()}); break;
    case 'like': S.board.posts.forEach(function(o){ if(o.id===a){var j=o.likes.indexOf(from); j<0?o.likes.push(from):o.likes.splice(j,1)} }); break;
    case 'pin': S.board.posts.forEach(function(o){ if(o.id===a)o.pin=!o.pin }); break;
    case 'addq': S.qbox.push({id:uid('q'),text:String(a).slice(0,90),metoo:[],done:false,at:now()}); break;
    case 'metoo': S.qbox.forEach(function(o){ if(o.id===a){var j2=o.metoo.indexOf(from); j2<0?o.metoo.push(from):o.metoo.splice(j2,1)} }); break;
    case 'answered': S.qbox.forEach(function(o){ if(o.id===a)o.done=!o.done }); break;
    case 'botson':
      for(i=0;i<12;i++){ var id='bot'+i;
        S.players[id]={nick:ADJ[i%ADJ.length]+' '+ANI[(i*5+3)%ANI.length],look:{b:BODY[i%BODY.length],h:HAIR[i%HAIR.length]},
          role:'student',room:'r1',seat:20+i,bot:true,at:now()} }
      break;
    case 'botsoff': for(i=0;i<12;i++)delete S.players['bot'+i]; break;
    default: return;
  }
  bump();
}

/* ───────── 묶기 ───────── */
function strip(t){
  var two=['에서','으로','에게','부터','까지','이라','라고','인데','는데','한다','하다','해요','아요','어요','이고','처럼','보다','만큼','라서','해서','하고'];
  for(var i=0;i<two.length;i++) if(t.length>=4&&t.slice(-2)===two[i])return t.slice(0,-2);
  if(t.length>=3&&'이가은는을를의에도만로와과랑'.indexOf(t.slice(-1))>=0)return t.slice(0,-1);
  return t;
}
function toks(s){var out=[],seen={};
  String(s||'').toLowerCase().replace(/[^0-9a-z가-힣\s]/g,' ').split(/\s+/).forEach(function(w){
    if(!w)return; var t=strip(w); if(t.length>=2&&!STOP[t]&&!seen[t]){seen[t]=1;out.push(t)}});
  return out}
function groups(){
  var q=S.q; if(!q)return [];
  var ds=q.answers,N=ds.length,df={};
  ds.forEach(function(d){toks(d.text).forEach(function(t){df[t]=(df[t]||0)+1})});
  var cap=Math.max(1,Math.floor(N*0.45)),gs=[];
  ds.forEach(function(d){
    var k=toks(d.text).filter(function(t){return df[t]<=cap}),hit=null;
    for(var i=0;i<gs.length&&!hit;i++)for(var j=0;j<k.length;j++)if(gs[i].k[k[j]]){hit=gs[i];break}
    if(!hit&&!k.length){for(var m=0;m<gs.length;m++)if(gs[m].etc){hit=gs[m];break}
      if(!hit){hit={k:{},top:{},items:[],etc:true};gs.push(hit)}}
    if(!hit){hit={k:{},top:{},items:[]};gs.push(hit)}
    k.forEach(function(t){hit.k[t]=1;hit.top[t]=(hit.top[t]||0)+1});
    hit.items.push(d);
  });
  gs.sort(function(a,b){return b.items.length-a.items.length});
  var seen={};
  return gs.map(function(g,i){
    var tops=Object.keys(g.top).sort(function(a,b){return g.top[b]-g.top[a]}).slice(0,2);
    var lab=g.etc||!tops.length?'기타':tops.join(' ');
    if(seen[lab])lab=lab+' '+(i+1); seen[lab]=1;
    var rep=g.items.slice().sort(function(a,b){
      var sa=toks(a.text).filter(function(t){return tops.indexOf(t)>=0}).length;
      var sb=toks(b.text).filter(function(t){return tops.indexOf(t)>=0}).length;
      return sb-sa||a.text.length-b.text.length})[0];
    return {key:lab,label:lab,items:g.items,rep:rep}});
}
function myP(){ return S.players[ME]||null }
function joined(){ return !!myP() }
function myRoom(){ var p=myP(); return p?(p.room||null):null }
function myAns(){ if(!S.q)return null; for(var i=0;i<S.q.answers.length;i++)if(S.q.answers[i].pid===ME)return S.q.answers[i]; return null }
function myGroup(){ var a=myAns(); if(!a)return null; var gs=groups();
  for(var i=0;i<gs.length;i++)for(var j=0;j<gs[i].items.length;j++)if(gs[i].items[j].id===a.id)return gs[i]; return null }
function timeLeft(){ var q=S.q; if(!q)return 0; return q.running?Math.max(0,q.endsAt-now()):Math.max(0,q.leftMs||0) }
function fmt(ms){ var s=Math.ceil(ms/1000); return (s<0?0:s)+'초' }

  h+='<p style="font-size:17px;font-weight:700;color:var(--ink)">'+(B.topic?esc(B.topic):'아직 주제가 올라오지 않았어요')+'</p>';
  if(p.role==='professor')h+='<div><label class="fl" for="topic">게시판 주제</label><div class="rowf"><input id="topic" value="'+esc(B.topic||'')+'" style="flex:1;min-width:200px"><button class="sm" data-act="settopic">주제 올리기</button></div></div>';
  h+='<div class="rowf"><button class="sm '+(ui.sortLike?'':'on')+'" data-act="sort" data-v="new">최신 순</button><button class="sm '+(ui.sortLike?'on':'')+'" data-act="sort" data-v="like">공감 많은 순</button></div>';
  if(B.topic)h+='<div><label class="fl" for="ptext">익명으로 의견 붙이기</label><div class="rowf"><input id="ptext" data-focus maxlength="80" placeholder="예: 생각할 시간 30초만 주셔도 달라질 것 같아요" style="flex:1;min-width:220px"><button class="pri" data-act="addpost">붙이기</button></div></div>';
  h+='<div class="posts">'+posts.map(function(o,i){var liked=o.likes.indexOf(ME)>=0;
    return '<div class="post p'+(i%4+1)+'">'+(o.pin?'<div style="font-size:13px;font-weight:700">📌 교수님이 다룰 의견</div>':'')+esc(o.text)+
     '<div class="f"><button data-act="like" data-v="'+o.id+'">'+(liked?'👍 공감함':'👍 공감')+'</button><span>'+o.likes.length+'</span>'+
     (p.role==='professor'?'<button data-act="pin" data-v="'+o.id+'" style="margin-left:auto">'+(o.pin?'고정 해제':'📌 고정')+'</button>':'')+'</div></div>'}).join('')+'</div>';
  return h+'</div></div>';
}
function mQbox(){
  var p=myP();
  var list=S.qbox.slice().sort(function(a,b){if(!!a.done!==!!b.done)return a.done?1:-1;return b.metoo.length-a.metoo.length||((b.at||0)-(a.at||0))});
  var h=topBar('질문함','학생 → 교수 익명 질문');
  h+='<div><label class="fl" for="qtext">수업 중 궁금한 것을 익명으로</label><div class="rowf"><input id="qtext" data-focus maxlength="90" placeholder="예: 지금 설명한 부분을 한 번만 더…" style="flex:1;min-width:220px"><button class="pri" data-act="addq">남기기</button></div></div>';
  h+='<div style="display:flex;flex-direction:column;gap:10px">'+list.map(function(o){var m2=o.metoo.indexOf(ME)>=0;
    return '<div class="qrow'+(o.done?' done':'')+'"><div class="me"><button class="sm '+(m2?'on':'')+'" data-act="metoo" data-v="'+o.id+'">'+(m2?'✓':'+')+'</button>'+o.metoo.length+'</div>'+
     '<div style="flex:1">'+esc(o.text)+(o.done?' <span class="chip">답변함</span>':'')+'<div style="font-size:13.5px;color:var(--faint)">나도 궁금해요 '+o.metoo.length+'명</div></div>'+
     (p.role==='professor'?'<button class="sm" data-act="answered" data-v="'+o.id+'">'+(o.done?'되돌리기':'답변함')+'</button>':'')+'</div>'}).join('')+'</div>';
  return h+'</div></div>';
}
function renderStage(){
  var q=S.q,el=$('#stage');
  var join='<div class="join"><div class="sm2">학생 입장</div><div class="u">'+esc(shortAddr())+'</div><div class="c">코드 '+esc(ROOM)+'</div></div>';
  if(!q){ el.innerHTML='<div class="sm2">'+esc(S.subject)+'</div><div class="sq">수업에 들어와 주세요</div><div class="srow">'+join+
    '<div><div class="sm2">들어온 사람</div><div class="big2">'+Object.keys(S.players).length+'</div></div><div style="flex:1"></div><button class="lg" data-act="unstage">닫기</button></div>'; return }
  el.innerHTML='<div class="sm2">'+esc(q.subject||S.subject)+' · 익명으로 한 줄 답하기</div><div class="sq">'+esc(q.prompt)+'</div>'+
   '<div class="srow"><div class="big2" data-timer>—</div>'+
   '<div><div class="sm2">도착한 답변</div><div class="big2">'+q.answers.length+'</div></div>'+
   '<div><div class="sm2">🙋 손들기</div><div class="big2">'+q.hands.length+'</div></div>'+join+
   '<div style="flex:1"></div><button class="lg" data-act="unstage">닫기</button></div>';
}
function rerender(){ if(ui.mode==='board')renderBoardPane(); else if(ui.modal)renderModal(); if(!$('#stage').hidden)renderStage(); renderHud(); renderDock() }

/* ───────── 액션 ───────── */
document.addEventListener('click',function(e){
  var b=e.target.closest&&e.target.closest('[data-act]'); if(!b)return;
  var a=b.getAttribute('data-act'),v=b.getAttribute('data-v');
  if(a==='close'){closeModal();return}
  if(a==='help'){openModal('help');return}
  if(a==='enter'){openModal('enter');return}
  if(a==='renick'){ui.nick=pick(ADJ)+' '+pick(ANI);renderModal();drawPv();return}
  if(a==='relook'){ui.look={b:pick(BODY),h:pick(HAIR)};renderModal();drawPv();return}
  if(a==='setroom'){ var ri=document.getElementById('rcode'),rv=((ri&&ri.value)||'').trim().toUpperCase().replace(/[^A-Z0-9\-]/g,'');
    if(!rv){toast('코드를 넣어 주세요');return} lsSet('bis-room',rv);
    var bp=/[?&](peer=[^&]+)/.exec(location.search);
    location.search='?r='+encodeURIComponent(rv)+(bp?'&'+bp[1]:''); return}
  if(a==='chgroom'){ lsSet('bis-room',''); location.search=''; return}
  if(a==='copylink'){ var u=joinUrl();
    if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(u).then(function(){toast('수업 링크를 복사했어요')},function(){toast(u)});
    else toast(u); return}
  if(a==='joinas'){
    lsSet('bis-me',{nick:ui.nick,look:ui.look}); lsSet('bis-room',ROOM);
    MEP={x:43,y:58,dir:0};
    if(!HOST&&!VIA){
      if(settled){ hostHere() }                       /* 연결을 다 확인했는데 아무도 없으면 내가 열기 */
      else{ ui.pendingJoin={t:'op',op:'join',a:{nick:ui.nick,look:ui.look,role:v}};
        toast('들어가는 중…'); closeModal(); paint(); return }
    }
    act('join',{nick:ui.nick,look:ui.look,role:v});
    closeModal(); fit(); paint(); return}
  if(!joined()){ if(a==='stage'){$('#stage').hidden=false;renderStage()} return }
  if(a==='role'){act('role',v);paint();return}
  if(a==='mode'){ui.mode=v==='board'?'board':'map';
    $('#mapwrap').hidden=ui.mode==='board'; $('#boardwrap').hidden=ui.mode!=='board';
    if(ui.mode==='board'){closeModal();renderBoardPane()}else fit(); paint(); return}
  if(a==='open'){ if(ui.mode==='board'&&v==='board'){renderBoardPane();return} openModal(v); return}
  if(a==='react'){react(v);return}
  if(a==='later'){toast('괜찮아요 — 끝까지 익명입니다');return}
  if(a==='conf'){ui.conf=+v;rerender();return}
  if(a==='sort'){ui.sortLike=(v==='like');renderModal();return}
  if(a==='sv1'){ui.sv1=+v;rerender();return}
  if(a==='sv2'){ui.sv2=+v;rerender();return}
  if(a==='qpick'){var t=document.getElementById('qprompt');if(t)t.value=SEEDQ[+v];return}
  if(a==='bots'){ui.bots=!ui.bots; act(ui.bots?'botson':'botsoff'); rerender(); return}
  if(a==='stage'){$('#stage').hidden=false;renderStage();return}
  if(a==='unstage'){$('#stage').hidden=true;return}
  if(a==='hist'){openModal('hist');return}
  if(a==='askq'){
    var pr=((document.getElementById('qprompt')||{}).value||'').trim();
    var sub=((document.getElementById('qsub')||{}).value||S.subject).trim();
    var sec=+((document.getElementById('qsecs')||{}).value||30);
    act('ask',{prompt:pr,sub:sub,secs:sec}); rerender(); return}
  if(a==='tstart'||a==='tpause'||a==='treset'||a==='closeq'||a==='reopen'||a==='newq'||a==='uninvite'||a==='spoke'){act(a);rerender();return}
  if(a==='submit'){
    var ta=document.getElementById('dtext'),tx=(ta&&ta.value||'').trim();
    if(!tx){toast('한 줄을 적어 주세요');return} if(!ui.conf){toast('확신도를 골라 주세요');return}
    ta.value=''; act('submit',{text:tx,c:ui.conf}); ui.conf=null; rerender(); toast('익명 답변이 교수자에게 도착했습니다'); return}
  if(a==='invite'){act('invite',v);rerender();return}
  if(a==='heard'){act('heard',v);rerender();return}
  if(a==='thank'){act('thank',v);rerender();return}
  if(a==='svsend'){act('survey',{raise:ui.sv1===1,submitted:ui.sv2===1});ui.sv1=null;ui.sv2=null;rerender();return}
  if(a==='settopic'){var ti=document.getElementById('topic');act('topic',(ti&&ti.value||'').trim());renderModal();return}
  if(a==='addpost'){var pi=document.getElementById('ptext'),px=(pi&&pi.value||'').trim(); if(!px)return; pi.value=''; act('post',px); renderModal(); return}
  if(a==='like'){act('like',v);renderModal();return}
  if(a==='pin'){act('pin',v);renderModal();return}
  if(a==='addq'){var qi=document.getElementById('qtext'),qx=(qi&&qi.value||'').trim(); if(!qx)return; qi.value=''; act('addq',qx); renderModal(); return}
  if(a==='metoo'){act('metoo',v);renderModal();return}
  if(a==='answered'){act('answered',v);renderModal();return}
});
document.addEventListener('keydown',function(e){
  if(e.key!=='Enter')return; var t=e.target,b;
  if(t.id==='ptext'){e.preventDefault();b=document.querySelector('[data-act="addpost"]');if(b)b.click()}
  if(t.id==='qtext'){e.preventDefault();b=document.querySelector('[data-act="addq"]');if(b)b.click()}
  if(t.id==='rcode'){e.preventDefault();b=document.querySelector('[data-act="setroom"]');if(b)b.click()}
});
function drawPv(){
  var c=document.getElementById('pv'); if(!c)return; var g=c.getContext('2d'); g.clearRect(0,0,60,80);
  var L=ui.look||{b:BODY[0],h:HAIR[0]},s=4,ox=22,oy=52;
  function r(x,y,w,h,col){g.fillStyle=col;g.fillRect(ox+x*s,oy+y*s,w*s,h*s)}
  r(-4,-13,8,3,L.h); r(-4,-11,8,6,'#f1d2b4'); r(-2,-9,1,1,'#3a3027'); r(1,-9,1,1,'#3a3027');
  r(-4,-6,8,5,L.b); r(-4,-1,3,2,'#2f3545'); r(1,-1,3,2,'#2f3545');
}
window.addEventListener('resize',function(){fit()});
window.addEventListener('beforeunload',function(){
  if(HOST)bcSay({k:'hostbye'});
  else{ if(joined())act('leave'); bcSay({k:'bye'}) }
  try{peer&&peer.destroy()}catch(e){} });

/* 시작: 교수 화면이 먼저 방을 잡고, 이미 있으면 학생으로 붙는다 */
if(!ROOM){ ROOM=''; setNet('init'); fit(); paint(); openModal('enter'); }
else { lsSet('bis-room',ROOM); setNet('connecting');
  bcOpen(); bcSay({k:'whois'});                 /* 같은 기기에 이미 열린 수업이 있나 */
  peerClient();                                 /* 다른 기기에 열린 수업이 있나 */
  setTimeout(settle,3600);                      /* 둔 쇼 없으면 이 창이 열긴다 */
  fit(); paint(); openModal('enter'); }
setTimeout(drawPv,60);
setInterval(botTick,900);
setInterval(function(){renderHud()},1500);
requestAnimationFrame(loop);
})();
</script>
